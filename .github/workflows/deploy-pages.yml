name: Deploy to Pages

# Publishes the committed dashboard to GitHub Pages. Runs only AFTER a successful
# Refresh, or on demand. Fully independent of the build: if Pages is misconfigured
# or GitHub Pages is down, the Refresh workflow still updates the repo file.

on:
  workflow_run:
    workflows: ["Refresh Dollar Monitor"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # only deploy if the refresh that triggered us actually succeeded
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p _site
          cp site/us-dollar-monitor.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
